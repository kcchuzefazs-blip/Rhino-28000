<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHINO 28000 | Clothing & Gadgets</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; }
        
        /* Navigation Header */
        header { background: #0f172a; color: white; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: 1px; color: #38bdf8; }
        .cart-icon { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; position: relative; font-weight: bold; transition: 0.2s; }
        .cart-icon:hover { background: #334155; }
        .cart-count { background: #38bdf8; color: #0f172a; padding: 2px 8px; border-radius: 50%; font-size: 12px; margin-left: 8px; font-weight: bold; }

        /* Storefront Layout */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 24px; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; letter-spacing: 0.5px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-bottom: 50px; }
        
        /* Product Display Cards */
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.06); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #e2e8f0; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .product-img { width: 100%; height: 280px; background-size: cover; background-position: center; background-color: #f1f5f9; }
        .product-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #1e293b; min-height: 44px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 15px; }
        .add-btn { background: #0f172a; color: white; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .add-btn:hover { background: #38bdf8; color: #0f172a; }

        /* Sliding Cart Drawer */
        .cart-drawer { position: fixed; top: 0; right: -420px; width: 420px; height: 100%; background: white; box-shadow: -10px 0 25px -5px rgba(0,0,0,0.1); z-index: 200; transition: right 0.3s ease; padding: 30px; display: flex; flex-direction: column; }
        .cart-drawer.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; }
        .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: #64748b; }
        .cart-items { flex: 1; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #f1f5f9; }
        .cart-item-details h4 { font-size: 14px; color: #1e293b; margin-bottom: 4px; }
        .cart-total { font-size: 22px; font-weight: bold; display: flex; justify-content: space-between; padding-top: 20px; border-top: 1px solid #e2e8f0; margin-bottom: 20px; }
        .checkout-btn { background: #38bdf8; color: #0f172a; border: none; width: 100%; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .checkout-btn:hover { background: #0ea5e9; color: white; }
        
        /* Dark Background Overlay */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 150; display: none; backdrop-filter: blur(4px); }
        .overlay.show { display: block; }

        @media (max-width: 480px) {
            .cart-drawer { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <!-- Top Navigation Bar -->
    <header>
        <div class="logo">RHINO 28000</div>
        <button class="cart-icon" onclick="toggleCart()">
            🛒 Shopping Cart <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <div class="container">
        <!-- Clothing Section -->
        <h2 class="section-title">Trending Apparel</h2>
        <div class="products-grid" id="clothingGrid"></div>

        <!-- Gadgets Section -->
        <h2 class="section-title">Premium Gadgets</h2>
        <div class="products-grid" id="gadgetsGrid"></div>
    </div>

    <!-- Slide-out Shopping Cart -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Your Cart Items</h3>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-total">
            <span>Subtotal:</span>
            <span id="cartTotal">₹0.00</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">Proceed to Pay</button>
    </div>

    <script>
        // Your specific store product database
        const inventory = [
            // Clothing Category
            { id: 1, category: "clothes", name: "Oversized Heavyweight Cotton Hoodie", price: 1899, img: "https://unsplash.com" },
            { id: 2, category: "clothes", name: "Classic Slim-Fit Denim Jacket", price: 2499, img: "https://unsplash.com" },
            { id: 3, category: "clothes", name: "Urban Streetwear Cargo Pants", price: 1599, img: "https://unsplash.com" },
            
            // Gadgets Category
            { id: 4, category: "gadgets", name: "ANC Wireless Noise-Cancelling Headphones", price: 4999, img: "https://unsplash.com" },
            { id: 5, category: "gadgets", name: "Waterproof Smartwatch with AMOLED Display", price: 3499, img: "https://unsplash.com" },
            { id: 6, category: "gadgets", name: "Mechanical RGB Wireless Gaming Keyboard", price: 2799, img: "https://unsplash.com" }
        ];

        let cart = [];

        // Distribute inventory to respective HTML layouts
        function renderStore() {
            const clothingGrid = document.getElementById('clothingGrid');
            const gadgetsGrid = document.getElementById('gadgetsGrid');

            const clothingHTML = inventory.filter(p => p.category === "clothes").map(product => createCardHTML(product)).join('');
            const gadgetsHTML = inventory.filter(p => p.category === "gadgets").map(product => createCardHTML(product)).join('');

            clothingGrid.innerHTML = clothingHTML;
            gadgetsGrid.innerHTML = gadgetsHTML;
        }

        function createCardHTML(product) {
            return `
                <div class="product-card">
                    <div class="product-img" style="background-image: url('${product.img}')"></div>
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-price">₹${product.price.toLocaleString('en-IN')}</div>
                        <button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                </div>
            `;
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function addToCart(id) {
            const item = inventory.find(p => p.id === id);
            cart.push(item);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = '<p style="color:#64748b; text-align:center; margin-top:20px;">Your cart is completely empty.</p>';
            } else {
                container.innerHTML = cart.map((item, index) => `
                    <div class="cart-item">
                        <div class="cart-item-details">
                            <h4>${item.name}</h4>
                            <strong style="color: #0f172a;">₹${item.price.toLocaleString('en-IN')}</strong>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ef4444; font-weight:600; cursor:pointer;">Delete</button>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = `₹${total.toLocaleString('en-IN')}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkout() {
            if (cart.length === 0) {
